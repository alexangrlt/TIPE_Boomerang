[project]
name = "tipe-boomerang"
version = "0.1.0"
description = "Simulation et Modélisation de la trajectoire du boomerang par méthode BEM"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "scipy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.hatch.build.targets.wheel.force-include]
"data/NACA_4420_T1_Re0.080_M0.00_N9.0.txt" = "data/NACA_4420_T1_Re0.080_M0.00_N9.0.txt"
